<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games TV</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">🎮</div>
    <div>
      <h1>GAMES <span>TV</span></h1>
      <p>Use as setas para escolher e OK para jogar &nbsp;•&nbsp; Segure o OK para limpar o jogo baixado</p>
    </div>
  </header>

  <main>
    <div id="grade" class="grade"></div>

    <section id="secaoGB">
      <h2 class="titulo-secao">Game Boy</h2>
      <div id="gradeGB" class="grade"></div>
    </section>
  </main>

  <footer>
    <button id="btnSair" class="sair" data-nav>⏻&nbsp; Sair do aplicativo</button>
  </footer>

  <p id="info" class="info"></p>

  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <h2 id="modalTitulo"></h2>
      <p id="modalTexto"></p>
      <button id="modalLimpar" class="mbtn" data-modal>🗑&nbsp; Limpar jogo baixado</button>
      <button id="modalCancelar" class="mbtn" data-modal>Cancelar</button>
    </div>
  </div>

  <div id="aviso" class="aviso"></div>
  <script src="app.js"></script>
</body>
</html>
